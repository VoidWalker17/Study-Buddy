<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f4ee"/>
      <stop offset="100%" stop-color="#ebe9e1"/>
    </linearGradient>
    <linearGradient id="curveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8c7b33" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8c7b33" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="decayFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10292d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10292d" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#e2e0d6" stroke-width="1" opacity="0.8">
    <line x1="80" y1="80" x2="720" y2="80"/>
    <line x1="80" y1="150" x2="720" y2="150"/>
    <line x1="80" y1="220" x2="720" y2="220"/>
    <line x1="80" y1="290" x2="720" y2="290"/>
    <line x1="80" y1="360" x2="720" y2="360"/>
    <line x1="80" y1="430" x2="720" y2="430"/>

    <line x1="80" y1="80" x2="80" y2="430"/>
    <line x1="240" y1="80" x2="240" y2="430"/>
    <line x1="400" y1="80" x2="400" y2="430"/>
    <line x1="560" y1="80" x2="560" y2="430"/>
    <line x1="720" y1="80" x2="720" y2="430"/>
  </g>

  <!-- Axis Lines -->
  <line x1="80" y1="430" x2="730" y2="430" stroke="#10292d" stroke-width="2"/>
  <line x1="80" y1="70" x2="80" y2="430" stroke="#10292d" stroke-width="2"/>

  <!-- Labels -->
  <text x="80" y="55" font-family="'Inter Tight', sans-serif" font-size="11" font-weight="600" fill="#8c7b33" letter-spacing="1.5">RETENTION RATIO R(t)</text>
  <text x="640" y="455" font-family="'Inter Tight', sans-serif" font-size="11" font-weight="600" fill="#66726f" letter-spacing="1.5">TIME INTERVALS Δt (DAYS)</text>

  <!-- Passive Forgetting Curve (Ebbinghaus Decay) -->
  <path d="M 80 120 Q 140 340 320 395 T 720 420 L 720 430 L 80 430 Z" fill="url(#decayFill)"/>
  <path d="M 80 120 Q 140 340 320 395 T 720 420" fill="none" stroke="#66726f" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="320" y="380" font-family="'Inter Tight', sans-serif" font-size="12" font-style="italic" fill="#66726f">Passive Cramming (78% Decay)</text>

  <!-- Active Feynman Synthesis Curves -->
  <!-- Session 1: 80 -> 240 -->
  <path d="M 80 120 Q 140 220 240 260" fill="none" stroke="#8c7b33" stroke-width="2.5"/>
  <!-- Reinforcement 1 -->
  <line x1="240" y1="260" x2="240" y2="105" stroke="#2f7d57" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="240" cy="105" r="5" fill="#2f7d57"/>
  <text x="248" y="102" font-family="'Inter Tight', sans-serif" font-size="11" font-weight="600" fill="#2f7d57">Teaching Session 1</text>

  <!-- Session 2: 240 -> 440 -->
  <path d="M 240 105 Q 330 160 440 185" fill="none" stroke="#8c7b33" stroke-width="2.5"/>
  <!-- Reinforcement 2 -->
  <line x1="440" y1="185" x2="440" y2="95" stroke="#2f7d57" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="440" cy="95" r="5" fill="#2f7d57"/>
  <text x="448" y="92" font-family="'Inter Tight', sans-serif" font-size="11" font-weight="600" fill="#2f7d57">Teaching Session 2</text>

  <!-- Session 3: 440 -> 720 (Permanent Memory Consolidation) -->
  <path d="M 440 95 Q 560 115 720 125" fill="none" stroke="#10292d" stroke-width="3"/>
  <circle cx="720" cy="125" r="6" fill="#8c7b33"/>
  <text x="590" y="112" font-family="'Inter Tight', sans-serif" font-size="12" font-weight="700" fill="#10292d">Permanent Neural Recall (94%)</text>

  <!-- Mathematical Annotation -->
  <g transform="translate(480, 240)">
    <rect width="210" height="95" rx="8" fill="#ffffff" stroke="#e2e0d6" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(16,41,45,0.06))"/>
    <text x="16" y="26" font-family="'Inter Tight', sans-serif" font-size="10" font-weight="700" fill="#8c7b33" letter-spacing="1">SYNAPTIC EQUATION</text>
    <text x="16" y="52" font-family="monospace" font-size="13" font-weight="600" fill="#10292d">R(t) = e^(-t / S_feynman)</text>
    <text x="16" y="74" font-family="'Inter Tight', sans-serif" font-size="10.5" fill="#66726f">S_feynman ≈ 4.8 × S_passive</text>
  </g>
</svg>
